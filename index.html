<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Saytning qidiruvda ko'rinadigan nomi -->
    <title>CineClub - Kinolar va seriallar o'zbek tilida</title>
    
    <!-- Qidiruv tizimlarida sayt tagida chiqadigan qisqacha ma'lumot -->
    <meta name="description" content="Eng sara kinolar, seriallar va filmlar o'zbek tilida. CineClub - sifatli tarjima kinolar olami.">
    
    <!-- Mashhur kinolar, seriallar va qidiruv so'zlari (Keywords) -->
    <meta name="keywords" content="kino o'zbek tilida, film o'zbek tilida, uzbek tilida, tarjima kinolar, seriallar uzbek tilida, Ajdar xonadoni, House of the Dragon o'zbek tilida, Breaking Bad, Taxtlar oyini, Shawshank Redemption, HD kinolar, premyera kinolar, cineclub, ozbekcha tarjima, kino korish">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #eef2f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .circle-top-left {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: #eef2f9;
            box-shadow: 15px 15px 30px #d1d9e6, -15px -15px 30px #ffffff;
            z-index: -1;
        }
        
        .circle-bottom-right {
            position: absolute;
            bottom: -80px;
            right: -50px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #eef2f9;
            box-shadow: inset 15px 15px 30px #d1d9e6, inset -15px -15px 30px #ffffff;
            z-index: -1;
        }

        .container {
            text-align: center;
            width: 85%;
            max-width: 350px;
            z-index: 1;
            padding: 20px 0;
        }

        .logo-bg {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px auto;
            border-radius: 30px;
            background: #eef2f9;
            box-shadow: 12px 12px 24px #d1d9e6, -12px -12px 24px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            color: #1e293b;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2b70fa, #4facfe);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(43, 112, 250, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 5px 10px rgba(43, 112, 250, 0.3);
        }

        .btn-secondary {
            background: #eef2f9;
            color: #475569;
            box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
        }

        .btn-secondary:active {
            box-shadow: inset 6px 6px 12px #d1d9e6, -6px -6px 12px #ffffff;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    
    <div class="circle-top-left"></div>
    <div class="circle-bottom-right"></div>

    <div class="container">
        <!-- Logotip qutisi va Kino lentasi SVG ikonka -->
        <div class="logo-bg">
            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#2b70fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="3" ry="3"></rect>
                <line x1="7" y1="2" x2="7" y2="22"></line>
                <line x1="17" y1="2" x2="17" y2="22"></line>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <line x1="2" y1="7" x2="7" y2="7"></line>
                <line x1="2" y1="17" x2="7" y2="17"></line>
                <line x1="17" y1="17" x2="22" y2="17"></line>
                <line x1="17" y1="7" x2="22" y2="7"></line>
            </svg>
        </div>
        
        <h1 class="title">CineClub</h1>
        <p class="subtitle">Eng sara kinolar olami</p>
        
        <!-- Tugmalar: Asosiy sahifa yuqorida (Ko'k) -->
        <a href="https://velvet-flow-reveal.lovable.app" class="btn btn-primary">Asosiy sahifa</a>
        
        <!-- Telegram Bot pastda (Oq 3D) -->
        <a href="https://t.me/cineclubnewbot" class="btn btn-secondary">Telegram Bot</a>
    </div>

</body>
</html>
